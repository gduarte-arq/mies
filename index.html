<style>
:root{
  --bg:#000; --fg:#fff; --red:#E3101B;
  --mute:#8a8a8a; --dim:#4d4d4d; --line:#232323; --line2:#3a3a3a; --panel:#0a0a0a;
  --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:15px;line-height:1.35;min-height:100dvh;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;font-size:17px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:10px 0;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--red)}
input::placeholder{color:var(--dim)}
input[type=date],input[type=datetime-local],input[type=number]{color-scheme:dark}
select{background:#000}
[hidden]{display:none!important}

/* ---------- chrome ---------- */
.hdr{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--st) + 10px) 16px 10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:.02em;font-size:13px;text-transform:uppercase}
.brand img{width:30px;height:30px;object-fit:cover;display:block}
.hdr-r{display:flex;align-items:center;gap:12px}
.sync{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.sync.online i{background:var(--fg)}
.sync.offline i,.sync.erro i{background:var(--red)}
.me{width:32px;height:32px;border:1px solid var(--fg);display:grid;place-items:center;font-size:11px;font-weight:600;font-family:var(--mono);text-decoration:none}
main#view{max-width:560px;margin:0 auto;padding:0 16px calc(var(--sb) + 104px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#000;border-top:1px solid var(--line);padding-bottom:var(--sb)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:flex;flex-direction:column;gap:3px;padding:10px 12px 12px;text-decoration:none;color:var(--mute);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border-top:2px solid transparent;margin-top:-1px}
.tabs a b{font-family:var(--mono);font-size:10px;font-weight:400}
.tabs a.on{color:var(--fg);border-top-color:var(--red)}
.tabs a.on b{color:var(--red)}

/* ---------- type ---------- */
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.mute{color:var(--mute)} .red{color:var(--red)} .dim{color:var(--dim)}
.display{font-weight:900;font-stretch:78%;text-transform:uppercase;letter-spacing:-.035em;line-height:.86}
.outline{color:transparent;-webkit-text-stroke:1.2px var(--fg)}
.outline.red{color:transparent;-webkit-text-stroke-color:var(--red)}
.up{text-transform:uppercase}
p{max-width:42ch}

/* ---------- hero ---------- */
.hero{padding:26px 0 20px}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hero .big{font-size:clamp(76px,27vw,148px)}
.hero .big small{display:block;font-size:.24em;letter-spacing:.01em;margin-bottom:.18em;color:var(--red)}
.hero .title{font-size:clamp(60px,20vw,112px)}
.hero-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:18px;border-top:1px solid var(--line);padding-top:10px;font-weight:800;text-transform:uppercase;font-size:15px}
.hero-meta .t{text-transform:none;color:var(--red);font-size:30px;font-weight:900;font-stretch:80%;letter-spacing:-.02em;white-space:nowrap}
.hero-meta em{font-style:normal;font-family:var(--mono);font-size:9px;font-weight:400;color:var(--mute);letter-spacing:.12em;margin-left:6px;vertical-align:middle}

/* ---------- sections ---------- */
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;gap:12px;border-top:1px solid var(--fg);padding-top:8px;margin-bottom:14px}
.sec-h .n{font-family:var(--mono);font-size:11px;color:var(--red)}
.sec-h .t{font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:13px;flex:1}
.sec-h .r{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.sub-h{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:18px 0 4px}
.hint{color:var(--mute);font-size:13px;margin:8px 0 14px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 14px;border:1px solid var(--fg);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px;text-decoration:none;text-align:center;transition:opacity .15s}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.white{background:var(--fg);color:#000}
.btn.ghost{border-color:var(--line2);color:var(--mute)}
.btn.sm{min-height:42px;font-size:11px}
.btn:active{opacity:.6}
.btn[disabled]{opacity:.3;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{margin-top:12px} .mt2{margin-top:22px}
.lnk{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:8px 0}
.lnk.red{color:var(--red)}

/* ---------- note ---------- */
.note{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:1px solid var(--red);padding:12px 14px;font-size:13px;margin-top:16px;text-decoration:none;text-align:left}
.note b{font-weight:800;text-transform:uppercase;letter-spacing:.02em}

/* ---------- phases ---------- */
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none}
.phases li{border-top:3px solid var(--line2);padding-top:8px;color:var(--dim);min-width:0}
.phases li b{display:block;font-family:var(--mono);font-size:10px;font-weight:400}
.phases li span{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.phases li i{display:block;font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.06em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phases li.done{border-color:var(--fg);color:var(--fg)}
.phases li.on{border-color:var(--red);color:var(--red)}

/* ---------- vote ---------- */
.opt{display:grid;grid-template-columns:78px 1fr 30px;align-items:center;column-gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.opt .t{font-weight:900;font-size:30px;font-stretch:78%;letter-spacing:-.03em;line-height:1}
.opt .bar{height:6px;background:var(--line);position:relative}
.opt .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--fg);transition:width .3s}
.opt .c{font-family:var(--mono);font-size:13px;text-align:right}
.opt .who{grid-column:2/4;font-family:var(--mono);font-size:9.5px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:6px;min-height:1em}
.opt.on .t,.opt.on .c{color:var(--red)}
.opt.on .bar i{background:var(--red)}
.opt[disabled]{cursor:default}
.opt .lock{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--red);display:block;margin-top:4px}

/* ---------- numbered list ---------- */
.nl{list-style:none}
.nl li{display:flex;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.nl .i{font-family:var(--mono);font-size:11px;color:var(--mute);width:22px;flex:none}
.nl .nm{flex:1;font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl .me .nm{color:var(--red)}
.nl .x{font-family:var(--mono);color:var(--mute);font-size:16px;padding:0 4px}
.nl .tag{font-family:var(--mono);font-size:9.5px;color:var(--mute);letter-spacing:.1em}
.nl.wait .nm{color:var(--mute)}
.inline-names{font-weight:700;text-transform:uppercase;color:var(--mute);font-size:14px;line-height:1.6}
.mypos{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin:10px 0 4px;color:var(--mute)}
.mypos b{color:var(--fg);font-weight:600}

/* ---------- teams ---------- */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.teams h3{font-weight:900;font-size:24px;font-stretch:80%;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:8px;line-height:1}
.teams ol{list-style:none}
.teams li{display:flex;gap:8px;align-items:baseline;font-weight:800;font-size:17px;text-transform:uppercase;padding:5px 0;min-width:0}
.teams li .i{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--mute);-webkit-text-stroke:0}
.teams li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teams .preto li .nm{color:transparent;-webkit-text-stroke:1px var(--fg)}

<noscript><p style="padding:24px">Ative o JavaScript para usar o app.</p></noscript>

<script>
/* =====================================================================
   MIES VAN DER GOL — app do time
   ---------------------------------------------------------------------
   DADOS COMPARTILHADOS: cole abaixo a URL do seu Firebase Realtime
   Database (veja instruções em Ajustes dentro do app). Sem URL, o app
   roda em "modo local" e os dados ficam só no aparelho.
   ===================================================================== */
const CONFIG = {
  FIREBASE_URL: "https://mies-2f599-default-rtdb.firebaseio.com/",            // ex: "https://mies-van-der-gol-default-rtdb.firebaseio.com"
  ROOT: "mies",                // nó raiz no banco
  POINTS: { win: 3, draw: 1, goal: 1, assist: 0.5, mvp: 1 },  // fórmula do ranking
  DEFAULT_VENUE: "Arena Ashclin",
  DEFAULT_TIMES: "20h, 21h, 22h",
  DEFAULT_CAP: 12,
  DEFAULT_WEEKDAY: 3           // 0=dom … 3=qua
};
const VERSION = "1.0";

/* ---------------- utils ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36).slice(-6) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const obj = x => (x && typeof x === 'object') ? x : {};
const arr = x => Array.isArray(x) ? x.filter(v => v != null) : (x && typeof x === 'object') ? Object.values(x) : [];
const clone = x => x == null ? x : JSON.parse(JSON.stringify(x));
const uniq = a => [...new Set(a)];
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toUpperCase().replace(/\s+/g, ' ');
const fmtN = n => (Math.round(n * 10) / 10).toLocaleString('pt-BR');
const WD = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const WDL = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const todayISO = () => toISO(new Date());
const ddmm = s => { const d = fromISO(s); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}`; };
const wd = s => WD[fromISO(s).getDay()];
const hfmt = t => { if (!t) return '—'; const [h, m] = t.split(':'); return m === '00' ? `${+h}h` : `${+h}h${m}`; };
const tsfmt = ts => { const d = new Date(ts); return `${WD[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const toLocalInput = ts => { const d = new Date(ts); return `${toISO(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
function parseTimes(s) {
  const out = [];
  String(s || '').split(/[,;\s]+/).forEach(tok => {
    const m = tok.trim().match(/^(\d{1,2})(?:[:hH](\d{2})?)?h?$/);
    if (m) { const h = +m[1], mi = +(m[2] || 0); if (h < 24 && mi < 60) out.push(`${pad(h)}:${pad(mi)}`); }
  });
  return uniq(out).sort();
}
const LS = { // localStorage com fallback em memória (aba anônima, storage bloqueado)
  mem: {},
  get(k, d) { let v; try { v = localStorage.getItem(k); } catch (e) {} if (v == null) v = this.mem[k]; try { return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { const s = JSON.stringify(v); this.mem[k] = s; try { localStorage.setItem(k, s); } catch (e) {} },
  del(k) { delete this.mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
};
let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 2600);
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------------- store (Firebase REST + SSE, ou local) ---------------- */
const Store = {
  state: { players: {}, games: {} },
  mode: 'local', url: '', status: 'local', ready: false, es: null,
  init() {
    this.url = String(LS.get('mies.dburl', '') || CONFIG.FIREBASE_URL || '').trim().replace(/\/+$/, '');
    if (this.url) {
      this.mode = 'remote';
      this.state = this.normalize(LS.get('mies.cache', null));
      this.connect();
    } else {
      this.mode = 'local'; this.status = 'local'; this.ready = true;
      this.state = this.normalize(LS.get('mies.local', null));
    }
  },
  normalize(v) { v = obj(v); return Object.assign({}, v, { players: obj(v.players), games: obj(v.games) }); },
  ref(path) { return `${this.url}/${CONFIG.ROOT}${path ? '/' + path : ''}.json`; },
  connect() {
    if (this.es) { try { this.es.close(); } catch (e) {} }
    this.status = 'conectando'; changed();
    if (!('EventSource' in window)) return this.poll();
    const es = this.es = new EventSource(this.ref(''));
    es.addEventListener('put', e => { const m = JSON.parse(e.data); this.applyRemote(m.path, m.data, false); });
    es.addEventListener('patch', e => { const m = JSON.parse(e.data); this.applyRemote(m.path, m.data, true); });
    es.addEventListener('cancel', () => { this.status = 'erro'; changed(); toast('Banco recusou a leitura (regras do Firebase?)', true); });
    es.addEventListener('auth_revoked', () => { this.status = 'erro'; changed(); });
    es.onopen = () => { this.status = 'online'; changed(); };
    es.onerror = () => { if (this.status !== 'erro') { this.status = navigator.onLine ? 'conectando' : 'offline'; changed(); } };
  },
  async poll() {
    try {
      const r = await fetch(this.ref('')); if (!r.ok) throw new Error(r.status);
      this.applyRemote('/', await r.json(), false); this.status = 'online';
    } catch (e) { this.status = 'offline'; changed(); }
    clearTimeout(this._pt); this._pt = setTimeout(() => this.poll(), 15000);
  },
  applyRemote(path, data, merge) {
    if (merge) { for (const k in obj(data)) this.setLocal(path + '/' + k, data[k]); }
    else this.setLocal(path, data);
    const first = !this.ready; this.ready = true; this.status = 'online';
    this.persist();
    if (first) ensureMe();
    changed();
  },
  setLocal(path, value) {
    const parts = String(path).split('/').filter(Boolean);
    if (!parts.length) { this.state = this.normalize(value); return; }
    let o = this.state;
    for (let i = 0; i < parts.length - 1; i++) {
      const k = parts[i];
      if (o[k] == null || typeof o[k] !== 'object') { if (value == null) return; o[k] = {}; }
      o = o[k];
    }
    const last = parts[parts.length - 1];
    if (value == null) delete o[last]; else o[last] = clone(value);
  },
  persist() { LS.set(this.mode === 'remote' ? 'mies.cache' : 'mies.local', this.state); },
  async write(method, path, value) {
    if (method === 'PATCH') { for (const k in value) this.setLocal(path + '/' + k, value[k]); }
    else this.setLocal(path, method === 'DELETE' ? null : value);
    this.persist(); changed();
    if (this.mode !== 'remote') return true;
    try {
      const r = await fetch(this.ref(path), { method: value == null && method === 'PUT' ? 'DELETE' : method, body: method === 'DELETE' || value == null ? undefined : JSON.stringify(value) });
      if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'sem permissão' : 'erro ' + r.status);
      return true;
    } catch (e) {
      toast('Não salvou: ' + (e.message || 'sem conexão'), true);
      this.resync(); return false;
    }
  },
  async resync() { try { const r = await fetch(this.ref('')); if (r.ok) this.applyRemote('/', await r.json(), false); } catch (e) {} },
  set(path, v) { return this.write('PUT', path, v); },
  update(path, o) { return this.write('PATCH', path, o); },
  remove(path) { return this.write('DELETE', path); }
};

/* ---------------- identity ---------------- */
const Me = {
  id() { return LS.get('mies.me', null); },
  name() { return LS.get('mies.meName', ''); },
  set(id, name) { LS.set('mies.me', id); LS.set('mies.meName', name); },
  clear() { LS.del('mies.me'); LS.del('mies.meName'); }
};
const P = () => Store.state.players;
const pname = id => (P()[id] && P()[id].name) || '?';
const initials = n => norm(n).replace(/[^A-Z0-9 ]/g, '').split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 2) || '··';
const playersSorted = () => Object.entries(P()).map(([id, p]) => ({ id, ...p })).sort((a, b) => norm(a.name).localeCompare(norm(b.name)));
const findByName = n => { const k = norm(n); return Object.keys(P()).find(id => norm(P()[id].name) === k) || null; };
function ensurePlayer(name) {
  name = String(name).trim().replace(/\s+/g, ' ').slice(0, 24);
  const ex = findByName(name); if (ex) return ex;
  const id = uid(); Store.set(`players/${id}`, { name, created: Date.now() }); return id;
}
function ensureMe() {
  const id = Me.id(), name = Me.name();
  if (!id || !name || P()[id]) return;
  const ex = findByName(name);
  if (ex) Me.set(ex, P()[ex].name); else Store.set(`players/${id}`, { name, created: Date.now() });
}

/* ---------------- game logic ---------------- */
const G = id => { const g = Store.state.games[id]; return g ? Object.assign({ id }, g) : null; };
const gamesList = () => Object.keys(Store.state.games).map(G).filter(g => g && g.date);
const byDate = (a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0);
const gameTimes = g => arr(g.times).slice().sort();
function voteCounts(g) { const c = {}; gameTimes(g).forEach(t => c[t] = 0); for (const t of Object.values(obj(g.votes))) if (t in c) c[t]++; return c; }
function leader(g) { const c = voteCounts(g); let best = null, bv = -1; for (const t of gameTimes(g)) if (c[t] > bv) { bv = c[t]; best = t; } return best; }
const voteOpen = g => !g.time && !g.done && gameTimes(g).length > 1 && Date.now() < (g.voteUntil || 0);
const effTime = g => g.time || leader(g);
function gameStart(g) {
  const d = fromISO(g.date); const t = effTime(g);
  if (t) { const [h, m] = t.split(':').map(Number); d.setHours(h, m, 0, 0); } else d.setHours(23, 59, 0, 0);
  return d.getTime();
}
const rsvpOpen = g => !g.done && Date.now() < gameStart(g);
function rsvpList(g) {
  const cap = +g.cap || CONFIG.DEFAULT_CAP;
  const all = Object.entries(obj(g.rsvp)).filter(([pid, r]) => r && P()[pid]).sort((a, b) => (a[1].t || 0) - (b[1].t || 0));
  const ins = all.filter(([, r]) => r.s === 'in').map(([p]) => p);
  return { ins: ins.slice(0, cap), wait: ins.slice(cap), outs: all.filter(([, r]) => r.s === 'out').map(([p]) => p), cap };
}
function phase(g) { if (g.done) return 4; if (voteOpen(g)) return 1; if (rsvpOpen(g)) return 2; return 3; }
function teamsOf(g, teamsObj) {
  const T = { B: [], P: [] };
  for (const [pid, s] of Object.entries(obj(teamsObj || g.teams))) if (P()[pid] && T[s]) T[s].push(pid);
  const L = rsvpList(g); const order = [...L.ins, ...L.wait];
  const rank = p => { const i = order.indexOf(p); return i < 0 ? 999 : i; };
  T.B.sort((a, b) => rank(a) - rank(b)); T.P.sort((a, b) => rank(a) - rank(b));
  return T;
}
function defaultVoteUntil(dateISO) {
  const d = fromISO(dateISO);
  const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7)); mon.setHours(23, 59, 0, 0);
  const noon = fromISO(dateISO).getTime() + 12 * 3600e3, now = Date.now();
  let t = Math.min(mon.getTime(), noon);
  if (t <= now) t = Math.min(now + 24 * 3600e3, noon);
  if (t <= now) t = now + 3600e3;
  return t;
}
function defaultGameDate() {
  const last = gamesList().sort(byDate).pop();
  const wdT = last ? fromISO(last.date).getDay() : CONFIG.DEFAULT_WEEKDAY;
  const d = new Date(); d.setHours(0, 0, 0, 0);
  while (d.getDay() !== wdT) d.setDate(d.getDate() + 1);
  return toISO(d);
}
function nextGame() { return gamesList().filter(g => !g.done && Date.now() <= gameStart(g)).sort(byDate)[0] || null; }
function pendingGames() { return gamesList().filter(g => !g.done && Date.now() > gameStart(g)).sort(byDate); }

/* ---------------- stats ---------------- */
function computeStats() {
  const W = CONFIG.POINTS, S = {};
  for (const [id, p] of Object.entries(P())) S[id] = { id, name: p.name, j: 0, v: 0, e: 0, d: 0, g: 0, a: 0, mvp: 0, conf: 0, form: [], hist: [] };
  for (const g of gamesList().sort(byDate)) {
    for (const [pid, r] of Object.entries(obj(g.rsvp))) if (r && r.s === 'in' && S[pid]) S[pid].conf++;
    if (!g.done) continue;
    const sc = obj(g.score), B = +sc.B || 0, PP = +sc.P || 0;
    for (const [pid, side] of Object.entries(obj(g.teams))) {
      const s = S[pid]; if (!s || (side !== 'B' && side !== 'P')) continue;
      const mine = side === 'B' ? B : PP, other = side === 'B' ? PP : B;
      const r = mine > other ? 'V' : mine < other ? 'D' : 'E';
      const st = obj(obj(g.stats)[pid]), gg = +st.g || 0, aa = +st.a || 0;
      s.j++; s[r.toLowerCase()]++; s.g += gg; s.a += aa; if (g.mvp === pid) s.mvp++;
      s.form.push(r);
      s.hist.push({ id: g.id, date: g.date, side, r, mine, other, g: gg, a: aa, mvp: g.mvp === pid });
    }
  }
  for (const s of Object.values(S)) {
    s.pts = s.v * W.win + s.e * W.draw + s.g * W.goal + s.a * W.assist + s.mvp * W.mvp;
    s.aprov = s.j ? (3 * s.v + s.e) / (3 * s.j) : 0;
    s.ppj = s.j ? s.pts / s.j : 0;
  }
  return S;
}
function drawTeams(pids) {
  const S = computeStats();
  const pool = pids.map(p => ({ p, s: (S[p] ? S[p].ppj : 0) + Math.random() * 0.6 })).sort((a, b) => b.s - a.s);
  const teams = {}; pool.forEach((x, i) => { const r = i % 4; teams[x.p] = (r === 0 || r === 3) ? 'B' : 'P'; });
  return teams;
}

/* ---------------- render infra ---------------- */
let pendingRender = false, rkKey = 'pts', draft = null, pickCb = null, lastHash = null;
function changed() { render(); }
function inputFocused() { const a = document.activeElement; return a && $('#view').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
function render(force) {
  if (!force && inputFocused()) { pendingRender = true; return; }
  pendingRender = false;
  const hash = location.hash.slice(1) || '/';
  const parts = hash.split('/').filter(Boolean);
  const routeChanged = hash !== lastHash; lastHash = hash;
  if (routeChanged && !(parts[0] === 'g' && (parts[2] === 'sumula' || parts[2] === 'times'))) draft = null;

  const me = Me.id();
  let html = '', tab = -1, chrome = true;
  if (!me) { html = vLogin(); chrome = false; }
  else switch (parts[0]) {
    case undefined: html = vHome(); tab = 0; break;
    case 'jogos': html = vGames(); tab = 1; break;
    case 'g':
      tab = 1;
      html = parts[2] === 'sumula' ? vEditor(parts[1], 'sumula') : parts[2] === 'times' ? vEditor(parts[1], 'times') : parts[2] === 'cartaz' ? vPoster(parts[1]) : vGame(parts[1]);
      break;
    case 'ranking': html = vRanking(); tab = 2; break;
    case 'elenco': html = vSquad(); tab = 3; break;
    case 'p': html = vPlayer(parts[1]); tab = 3; break;
    case 'ajustes': html = vSettings(); break;
    default: html = vNotFound();
  }
  renderChrome(tab, chrome);
  $('#view').innerHTML = html;
  if (routeChanged) window.scrollTo(0, 0);
  const pc = $('#poster'); if (pc) drawPoster(pc, G(pc.dataset.id));
}
function renderChrome(tab, show) {
  $('#hdr').hidden = !show; $('#tabs').hidden = !show;
  if (!show) return;
  const st = Store.mode === 'local' ? 'local' : Store.status;
  $('#hdr').innerHTML = `<div class="hdr-in"><a class="brand" href="#/"><img src="${ASSETS.icon}" alt=""><span><span class="red">Mies</span> Van der Gol</span></a>
    <div class="hdr-r"><span class="sync ${st}"><i></i>${st}</span><a class="me" href="#/ajustes" aria-label="Ajustes">${esc(initials(pname(Me.id())))}</a></div></div>`;
  const T = [['#/', 'Jogo'], ['#/jogos', 'Agenda'], ['#/ranking', 'Ranking'], ['#/elenco', 'Elenco']];
  $('#tabs').innerHTML = `<div class="tabs-in">${T.map((t, i) => `<a href="${t[0]}" class="${i === tab ? 'on' : ''}"><b>${pad(i + 1)}</b>${t[1]}</a>`).join('')}</div>`;
}
const secH = (n, t, r) => `<div class="sec-h"><span class="n">${n}</span><span class="t">${t}</span>${r ? `<span class="r">${r}</span>` : ''}</div>`;
const vNotFound = () => `<section class="hero"><div class="display title">404</div><p class="empty-p">Não encontrado.</p></section><a class="btn" href="#/">Voltar ao início</a>`;

/* ---------------- views ---------------- */

      <div class="mono mute">01 — Identificação</div>

function vHome() {
  const next = nextGame(), pend = pendingGames();
  let h = '';
  if (Store.mode === 'local') h += `<a class="note" href="#/ajustes"><span><b>Modo local.</b> Os dados ficam só neste aparelho.</span><span class="mono red">Configurar →</span></a>`;
  for (const g of pend) h += `<a class="note" href="#/g/${g.id}/sumula"><span><b>Súmula pendente</b> · ${wd(g.date)} ${ddmm(g.date)}</span><span class="mono red">Lançar →</span></a>`;
  if (next) h += gameBody(next, true);
  else {
    const last = gamesList().filter(g => g.done).sort(byDate).pop();
    h += `<section class="hero">
      <div class="hero-top"><span class="mono mute">Semana ${isoWeek(new Date())}</span></div>
      <div class="display title">Sem<br><span class="outline">jogo</span></div>
      <p class="empty-p">Nenhum jogo marcado. Crie o jogo da semana para abrir a votação de horário e a lista de presença.</p>
    </section>
    <button class="btn red" data-act="newGame">+ Criar jogo da semana</button>`;
    if (last) h += `<div class="sec">${secH('—', 'Último jogo', `${wd(last.date)} ${ddmm(last.date)}`)}${scoreBlock(last, true)}<a class="lnk" href="#/g/${last.id}">Ver jogo →</a></div>`;
  }
  h += top3();
  return h;
}

function top3() {
  const S = Object.values(computeStats()).filter(s => s.j > 0);
  if (!S.length) return '';
  const best = k => S.slice().sort((a, b) => b[k] - a[k] || b.pts - a.pts)[0];
  const cards = [['Líder', best('pts'), 'pts'], ['Artilheiro', best('g'), 'g'], ['Garçom', best('a'), 'a']];
  return `<div class="sec">${secH('★', 'Destaques', '<a href="#/ranking" class="red" style="text-decoration:none">Ranking →</a>')}
    <div class="grid3">${cards.map(([l, s, k]) => `<a href="#/p/${s.id}"><span>${l}</span><em>${esc(s.name)}</em><b>${fmtN(s[k])}</b></a>`).join('')}</div></div>`;
}

function phasesBlock(g) {
  const ph = phase(g), t = effTime(g);
  const items = [
    ['Votação', g.voteUntil && gameTimes(g).length > 1 ? `até ${WD[new Date(g.voteUntil).getDay()]} ${pad(new Date(g.voteUntil).getHours())}h` : 'fixo'],
    ['Lista', `até ${hfmt(t)}`],
    ['Jogo', `${wd(g.date)} ${ddmm(g.date)}`],
    ['Súmula', g.done ? 'ok' : 'pendente']
  ];
  return `<ol class="phases">${items.map((it, i) => {
    const n = i + 1; const cls = n < ph ? 'done' : n === ph ? 'on' : '';
    return `<li class="${cls}"><b>${pad(n)}</b><span>${it[0]}</span><i>${it[1]}</i></li>`;
  }).join('')}</ol>`;
}

function gameBody(g, home) {
  const me = Me.id(), t = effTime(g), L = rsvpList(g), myR = obj(g.rsvp)[me];
  const today = g.date === todayISO() && !g.done;
  let h = `<section class="hero">
    <div class="hero-top"><span class="mono mute">${home ? 'Jogo da semana' : 'Jogo'} · S${isoWeek(fromISO(g.date))}</span>${today ? '<span class="mono red">● Hoje tem jogo</span>' : ''}</div>
    <div class="display big"><small>${WDL[fromISO(g.date).getDay()]}</small>${ddmm(g.date)}</div>
    <div class="hero-meta"><span>${esc(g.venue || '—')}</span><span class="t">${hfmt(t)}${!g.time && voteOpen(g) ? '<em>provisório</em>' : ''}</span></div>
  </section>${phasesBlock(g)}`;

  // 01 horário
  const times = gameTimes(g);
  if (times.length > 1) {
    const c = voteCounts(g), max = Math.max(1, ...Object.values(c)), open = voteOpen(g), myV = obj(g.votes)[me];
    const right = open ? `até ${tsfmt(g.voteUntil)}` : g.time ? 'fechado' : 'encerrada';
    h += `<div class="sec">${secH('01', 'Horário', right)}
      ${open ? '<p class="hint">Vote no horário que você pode. Toque de novo para tirar o voto.</p>' : ''}
      ${times.map(tm => {
        const who = Object.entries(obj(g.votes)).filter(([, v]) => v === tm).map(([p]) => pname(p)).join(' · ');
        const win = !open && t === tm;
        return `<button class="opt ${myV === tm ? 'on' : ''}" data-act="vote" data-id="${g.id}" data-t="${tm}" ${open ? '' : 'disabled'}>
          <span class="t ${win ? 'red' : ''}">${hfmt(tm)}${win ? '<span class="lock">definido</span>' : ''}</span>
          <span class="bar"><i style="width:${(c[tm] / max) * 100}%"></i></span><span class="c">${c[tm]}</span>
          <span class="who">${esc(who)}</span></button>`;
      }).join('')}
      ${open ? `<button class="btn sm ghost mt" data-act="lockTime" data-id="${g.id}">Fechar votação em ${hfmt(leader(g))}</button>` : ''}
    </div>`;
  }

  // 02 lista
  const open = rsvpOpen(g);
  const myIn = myR && myR.s === 'in', myOut = myR && myR.s === 'out';
  const myPos = L.ins.indexOf(me), myWait = L.wait.indexOf(me);
  h += `<div class="sec">${secH('02', 'Lista de presença', `${pad(L.ins.length)} / ${pad(L.cap)}`)}`;
  if (open) {
    h += `<div class="row2">
        <button class="btn ${myIn ? 'red' : ''}" data-act="rsvp" data-id="${g.id}" data-s="in">${myIn ? '✓ Vou' : 'Vou'}</button>
        <button class="btn ${myOut ? 'white' : 'ghost'}" data-act="rsvp" data-id="${g.id}" data-s="out">Não vou</button>
      </div>
      ${myPos >= 0 ? `<div class="mypos">Você é o <b>nº ${pad(myPos + 1)}</b> da lista</div>` : myWait >= 0 ? `<div class="mypos">Lista de espera · <b>nº ${myWait + 1}</b></div>` : !myR ? `<div class="mypos">Confirme até ${wd(g.date)} ${hfmt(t)}</div>` : ''}`;
  } else if (!g.done) h += `<div class="mypos">Lista fechada</div>`;
  const row = (p, i) => {
    const r = obj(g.rsvp)[p] || {}; const canX = open && p !== me && r.by === me;
    return `<li class="${p === me ? 'me' : ''}"><span class="i">${pad(i + 1)}</span><span class="nm">${esc(pname(p))}</span>${r.by && r.by !== p ? `<span class="tag">+${esc(initials(pname(r.by)))}</span>` : ''}${canX ? `<button class="x" data-act="unrsvp" data-id="${g.id}" data-pid="${p}" aria-label="remover">×</button>` : ''}</li>`;
  };
  h += L.ins.length ? `<ol class="nl mt">${L.ins.map(row).join('')}</ol>` : `<p class="hint">Ninguém confirmado ainda.</p>`;
  if (L.wait.length) h += `<div class="sub-h">Espera</div><ol class="nl wait">${L.wait.map((p, i) => row(p, L.cap + i)).join('')}</ol>`;
  if (L.outs.length) h += `<div class="sub-h">Não vão</div><div class="inline-names">${L.outs.map(p => esc(pname(p))).join(' · ')}</div>`;
  if (open) h += `<button class="lnk" data-act="addRsvp" data-id="${g.id}">+ Confirmar outro jogador</button>`;
  h += `</div>`;

  // 03 times
  const T = teamsOf(g);
  h += `<div class="sec">${secH('03', 'Times', T.B.length || T.P.length ? `${T.B.length} × ${T.P.length}` : '')}`;
  h += (T.B.length || T.P.length) ? teamsBlock(g, T) : `<p class="hint">Times ainda não definidos. Sorteie (equilibrado pelo ranking) ou monte na mão.</p>`;
  h += `<div class="row3 mt">
      <button class="btn sm" data-act="draw" data-id="${g.id}" ${L.ins.length < 2 || g.done ? 'disabled' : ''}>Sortear</button>
      <a class="btn sm" href="#/g/${g.id}/times">Editar</a>
      <a class="btn sm ${T.B.length || T.P.length ? '' : 'ghost'}" href="#/g/${g.id}/cartaz">Cartaz</a>
    </div></div>`;

  // 04 súmula
  h += `<div class="sec">${secH('04', 'Súmula', g.done ? 'encerrado' : '')}`;
  if (g.done) h += scoreBlock(g) + `<a class="btn ghost sm mt2" href="#/g/${g.id}/sumula">Editar súmula</a>`;
  else h += `<p class="hint">Depois do jogo: placar, gols, assistências e craque. Os números alimentam o ranking.</p><a class="btn ${phase(g) >= 3 ? 'red' : ''}" href="#/g/${g.id}/sumula">Lançar súmula</a>`;
  h += `</div>`;

  // admin
  h += `<div class="sec">${secH('··', 'Jogo')}<div class="row2"><button class="btn sm ghost" data-act="editGame" data-id="${g.id}">Editar jogo</button><button class="btn sm ghost" data-act="delGame" data-id="${g.id}">Excluir</button></div></div>`;
  return h;
}

function teamsBlock(g, T) {
  const st = obj(g.stats);
  const li = (p, i) => { const s = obj(st[p]); const ga = g.done ? [s.g ? `${s.g}G` : '', s.a ? `${s.a}A` : ''].filter(Boolean).join(' ') : '';
    return `<li><span class="i">${i + 1}.</span><span class="nm">${esc(pname(p))}</span>${ga ? `<span class="ga">${ga}</span>` : ''}</li>`; };
  return `<div class="teams"><div><h3>Time Branco</h3><ol>${T.B.map(li).join('')}</ol></div>
    <div class="preto"><h3 class="outline">Time Preto</h3><ol>${T.P.map(li).join('')}</ol></div></div>`;
}

function scoreBlock(g, small) {
  const sc = obj(g.score), B = +sc.B || 0, PP = +sc.P || 0;
  let h = `<div class="score ${small ? 'sm' : ''}">
    <div class="side"><span class="mono mute">Branco</span><b class="display n ${B > PP ? 'red' : ''}">${B}</b></div>
    <span class="display x">×</span>
    <div class="side r"><span class="mono mute">Preto</span><b class="display n outline ${PP > B ? 'red' : ''}">${PP}</b></div></div>`;
  if (!small) {
    h += teamsBlock(g, teamsOf(g));
    if (g.mvp && P()[g.mvp]) h += `<div class="mvp"><span class="mono mute">Craque do jogo</span><b>${esc(pname(g.mvp))}</b></div>`;
  }
  return h;
}

function vGame(id) { const g = G(id); return g ? gameBody(g, false) : vNotFound(); }

function vGames() {
  const gs = gamesList();
  const up = gs.filter(g => !g.done).sort(byDate), past = gs.filter(g => g.done).sort(byDate).reverse();
  const row = g => {
    const L = rsvpList(g), sc = obj(g.score);
    const right = g.done ? `<span class="res">${+sc.B || 0}<i>×</i>${+sc.P || 0}</span>`
      : Date.now() > gameStart(g) ? `<span class="mono red">Súmula</span>` : `<span class="mono">${pad(L.ins.length)}/${pad(L.cap)}</span>`;
    return `<a class="grow" href="#/g/${g.id}"><span class="display gd">${ddmm(g.date)}</span><span class="gm" style="min-width:0"><b>${wd(g.date)} · ${hfmt(effTime(g))}</b><i>${esc(g.venue || '')}</i></span>${right}</a>`;
  };
  return `<section class="hero"><div class="hero-top"><span class="mono mute">${gs.length} jogos · ${past.length} encerrados</span></div><div class="display title">Agen<br>da</div></section>
    <button class="btn red" data-act="newGame">+ Novo jogo</button>
    <div class="sec">${secH('01', 'Próximos / em aberto', pad(up.length))}${up.length ? up.map(row).join('') : '<p class="hint">Nada marcado.</p>'}</div>
    <div class="sec">${secH('02', 'Encerrados', pad(past.length))}${past.length ? past.map(row).join('') : '<p class="hint">Nenhum resultado lançado ainda.</p>'}</div>`;
}

const RK = [['pts', 'Pontos'], ['g', 'Gols'], ['a', 'Assist.'], ['v', 'Vitórias'], ['aprov', 'Aproveit.'], ['mvp', 'Craque'], ['j', 'Jogos'], ['conf', 'Presença']];
function vRanking() {
  const S = computeStats(), done = gamesList().filter(g => g.done).length, me = Me.id();
  let list = Object.values(S).filter(s => s.j > 0 || (rkKey === 'conf' && s.conf > 0));
  const minJ = rkKey === 'aprov' ? Math.max(1, Math.ceil(done * 0.3)) : 0;
  list = list.filter(s => s.j >= minJ);
  list.sort((a, b) => (b[rkKey] - a[rkKey]) || (b.pts - a.pts) || (b.g - a.g) || norm(a.name).localeCompare(norm(b.name)));
  const val = s => rkKey === 'aprov' ? Math.round(s.aprov * 100) + '%' : fmtN(s[rkKey]);
  const W = CONFIG.POINTS;
  let pos = 0, prev = null;
  const rows = list.map((s, i) => { if (s[rkKey] !== prev) { pos = i + 1; prev = s[rkKey]; }
    return `<a class="rk ${pos === 1 ? 'first' : ''}" href="#/p/${s.id}"><span class="p">${pad(pos)}</span>
      <span style="min-width:0"><div class="nm">${esc(s.name)}${s.id === me ? '<span class="you">você</span>' : ''}</div><div class="sub">${s.j}J ${s.v}V ${s.e}E ${s.d}D · ${s.g}G ${s.a}A${s.mvp ? ` · ${s.mvp}★` : ''}</div></span>
      <span class="v">${val(s)}</span></a>`; }).join('');
  return `<section class="hero"><div class="hero-top"><span class="mono mute">${done} jogos · ${list.length} jogadores</span></div><div class="display title">Rank<br><span class="outline">ing</span></div></section>
    <div class="chips">${RK.map(([k, l]) => `<button class="chip ${k === rkKey ? 'on' : ''}" data-act="rk" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="mt">${rows || '<p class="hint">Sem dados ainda. Lance a súmula de um jogo para o ranking aparecer.</p>'}</div>
    ${rkKey === 'aprov' ? `<p class="hint">Aproveitamento = pontos de jogo (3 V, 1 E) ÷ pontos possíveis. Mínimo de ${minJ} jogo(s).</p>` : ''}
    <div class="foot"><span class="mono mute">Pontos</span><span class="mono">${W.win}·V + ${W.draw}·E + ${W.goal}·G + ${String(W.assist).replace('.', ',')}·A + ${W.mvp}·★</span></div>`;
}

function vSquad() {
  const S = computeStats(), me = Me.id(), ps = playersSorted();
  return `<section class="hero"><div class="hero-top"><span class="mono mute">${ps.length} jogadores</span></div><div class="display title">Elen<br>co</div></section>
    <form data-form="addPlayer" class="inline" autocomplete="off"><input name="name" placeholder="Adicionar jogador" maxlength="24"><button class="btn sm red">Adicionar</button></form>
    <div class="mt2">${ps.map((p, i) => { const s = S[p.id];
      return `<a class="rk" href="#/p/${p.id}"><span class="p">${pad(i + 1)}</span><span style="min-width:0"><div class="nm">${esc(p.name)}${p.id === me ? '<span class="you">você</span>' : ''}</div><div class="sub">${s.j} jogos · ${s.g}G ${s.a}A · ${s.conf} presenças</div></span><span class="v mute">${fmtN(s.pts)}</span></a>`; }).join('')}</div>`;
}

function vPlayer(id) {
  const p = P()[id]; if (!p) return vNotFound();
  const S = computeStats(), s = S[id], me = Me.id();
  const ranked = Object.values(S).filter(x => x.j > 0).sort((a, b) => b.pts - a.pts || b.g - a.g);
  const pos = ranked.findIndex(x => x.id === id) + 1;

/* ---------- editor (times / súmula) ---------- */
function draftScore() {
  const sc = { B: +draft.extra.B || 0, P: +draft.extra.P || 0 };
  for (const [p, s] of Object.entries(draft.teams)) if (sc[s] != null) sc[s] += +obj(draft.stats[p]).g || 0;
  return sc;
}
function vEditor(id, mode) {
  const g = G(id); if (!g) return vNotFound();
  if (!draft || draft.id !== id || draft.mode !== mode) {
    draft = { id, mode, teams: Object.assign({}, obj(g.teams)), stats: clone(obj(g.stats)) || {}, extra: { B: +obj(g.extra).B || 0, P: +obj(g.extra).P || 0 }, mvp: g.mvp || '', pool: [] };
  }
  const L = rsvpList(g);
  const pool = uniq([...Object.keys(draft.teams), ...L.ins, ...L.wait, ...Object.keys(draft.stats), ...draft.pool]).filter(p => P()[p]);
  const grp = { B: [], P: [], N: [] };
  pool.forEach(p => grp[draft.teams[p] === 'B' || draft.teams[p] === 'P' ? draft.teams[p] : 'N'].push(p));
  const sum = mode === 'sumula';
  const sc = draftScore();
  const stepper = (p, k, label) => { const v = +obj(draft.stats[p])[k] || 0;
    return `<div class="step ${v ? 'hot' : ''}"><span>${label}</span><button data-act="st" data-pid="${p}" data-k="${k}" data-d="-1" aria-label="menos">−</button><b>${v}</b><button data-act="st" data-pid="${p}" data-k="${k}" data-d="1" aria-label="mais">+</button></div>`; };
  const prow = p => { const s = draft.teams[p] || 'N';
    return `<div class="prow"><div class="top"><span class="nm">${esc(pname(p))}</span>
      <div class="seg">${['B', 'P', 'N'].map(x => `<button class="${x} ${s === x ? 'on' : ''}" data-act="side" data-pid="${p}" data-s="${x}">${x === 'N' ? '—' : x}</button>`).join('')}</div></div>
      ${sum && s !== 'N' ? `<div class="steps">${stepper(p, 'g', 'Gol')}${stepper(p, 'a', 'Assist')}</div>` : ''}</div>`; };
  const group = (k, label) => grp[k].length || k !== 'N' ? `<div class="grp ${k === 'P' ? 'p' : ''}"><span>${label}</span><span class="mono mute">${pad(grp[k].length)}</span></div>${grp[k].map(prow).join('') || '<p class="hint">Toque em B ou P para escalar.</p>'}` : '';
  let h = `<div class="ed-h"><button class="lnk" data-act="back">← Voltar</button><span class="mono">${sum ? 'Súmula' : 'Times'} · ${wd(g.date)} ${ddmm(g.date)}</span></div>`;
  if (sum) h += `<div class="sticky"><div class="score sm"><div class="side"><span class="mono mute">Branco</span><b class="display n ${sc.B > sc.P ? 'red' : ''}">${sc.B}</b></div><span class="display x">×</span><div class="side r"><span class="mono mute">Preto</span><b class="display n outline ${sc.P > sc.B ? 'red' : ''}">${sc.P}</b></div></div></div>`;
  else h += `<p class="hint">B = Time Branco · P = Time Preto. Os confirmados aparecem aqui automaticamente.</p><button class="btn sm" data-act="edDraw">Sortear entre os confirmados</button>`;
  h += group('B', 'Time Branco') + group('P', 'Time Preto') + group('N', 'Sem time');
  h += `<button class="lnk mt" data-act="edAdd">+ Adicionar jogador</button>`;
  if (sum) {
    const inTeams = pool.filter(p => draft.teams[p] === 'B' || draft.teams[p] === 'P');
    h += `<div class="sec">${secH('+', 'Gols contra / sem autor')}
      <div class="steps">${['B', 'P'].map(k => `<div class="step ${draft.extra[k] ? 'hot' : ''}"><span>${k === 'B' ? 'Branco' : 'Preto'}</span><button data-act="ex" data-k="${k}" data-d="-1">−</button><b>${draft.extra[k]}</b><button data-act="ex" data-k="${k}" data-d="1">+</button></div>`).join('')}</div>
      <p class="hint">Gol contra conta para o time adversário de quem fez.</p></div>
      <div class="sec">${secH('★', 'Craque do jogo')}
      <select id="mvpSel"><option value="">— ninguém</option>${inTeams.map(p => `<option value="${p}" ${draft.mvp === p ? 'selected' : ''}>${esc(pname(p))}</option>`).join('')}</select></div>`;
  }
  h += `<div class="savebar"><button class="btn red" data-act="edSave">${sum ? (g.done ? 'Atualizar resultado' : 'Salvar resultado') : 'Salvar times'}</button></div>`;
  if (sum && g.done) h += `<button class="btn ghost sm mt" data-act="edClear">Apagar resultado</button>`;
  return h;
}

const imgCache = {};
function loadImg(src) { return imgCache[src] || (imgCache[src] = new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; })); }
let posterSeq = 0;
async function drawPoster(cv, g) {
  if (!g) return; const seq = ++posterSeq;
  const W = 1080, H = 1350, c = cv.getContext('2d');
  try { await Promise.all(['900 150px Archivo', '800 64px Archivo', '400 46px Archivo'].map(f => document.fonts.load(f))); } catch (e) {}
  const img = await loadImg(ASSETS.icon);
  if (seq !== posterSeq) return;
  const F = (w, s) => `${w} ${s}px Archivo, "Helvetica Neue", Arial, sans-serif`;
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  // logo
  if (img) { const s = 560; c.drawImage(img, (W - s) / 2 + 40, 690, s, s); }
  // MIES + eco
  c.font = F(900, 160); c.textBaseline = 'alphabetic'; c.textAlign = 'center';
  const xs = [0.16, 0.40, 0.62, 0.855];
  [['#1c1c1c', 74], ['#2e2e2e', 37]].forEach(([col, dy]) => { c.fillStyle = col; 'MIES'.split('').forEach((ch, i) => c.fillText(ch, xs[i] * W, 185 + dy)); });
  c.fillStyle = '#E3101B'; 'MIES'.split('').forEach((ch, i) => c.fillText(ch, xs[i] * W, 185));
  // times
  const T = teamsOf(g), n = Math.max(T.B.length, T.P.length, 1);
  const top = 400, avail = 300 + (n > 6 ? 40 : 0), lh = Math.min(70, avail / n * 1.15), fs = Math.min(54, lh * 0.8);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.font = F(800, 58); c.fillStyle = '#fff'; c.fillText('TIME BRANCO', 92, 330);
  c.strokeStyle = '#fff'; c.lineWidth = 2.2; c.strokeText('TIME PRETO', 610, 330);
  const fit = (txt, max, size, w) => { let s = size; c.font = F(w, s); while (c.measureText(txt).width > max && s > 20) { s -= 2; c.font = F(w, s); } };
  T.B.forEach((p, i) => { const t = `${i + 1}. ${pname(p).toUpperCase()}`; fit(t, 430, fs, 800); c.fillStyle = '#fff'; c.fillText(t, 104, top + i * lh); });
  T.P.forEach((p, i) => { const t = `${i + 1}. ${pname(p).toUpperCase()}`; fit(t, 430, fs, 800); c.lineWidth = 1.8; c.strokeText(t, 618, top + i * lh); });
  // rodapé
  const bottom = H - 46;
  c.font = F(400, 48); c.fillStyle = '#fff';
  const dd = fromISO(g.date);
  c.textAlign = 'left'; c.fillText(`${pad(dd.getDate())}/${pad(dd.getMonth() + 1)}`, 40, bottom);
  c.textAlign = 'center'; c.fillText(g.venue || '', W / 2, bottom);
  c.textAlign = 'right'; c.fillText(hfmt(effTime(g)), W - 40, bottom);
  c.fillStyle = '#E3101B'; c.beginPath(); c.arc(W - 150, bottom - 110, 7, 0, Math.PI * 2); c.fill();
  c.textAlign = 'left';
}

/* ---------------- actions ---------------- */
const ACT = {
  go: d => { location.hash = d.h; },
  back: () => { draft = null; if (history.length > 1) history.back(); else location.hash = '#/'; },
  closeSheet: () => closeSheet(),
  iam: d => { Me.set(d.pid, pname(d.pid)); location.hash = '#/'; render(true); },
  logout: () => { if (confirm('Sair e escolher outro nome neste aparelho?')) { Me.clear(); location.hash = '#/'; render(true); } },
  newGame: () => gameForm(null),
  editGame: d => gameForm(G(d.id)),
  delGame: d => { const g = G(d.id); if (g && confirm(`Excluir o jogo de ${wd(g.date)} ${ddmm(g.date)}? Isso apaga lista, times e resultado.`)) { Store.remove(`games/${d.id}`); location.hash = '#/jogos'; toast('Jogo excluído'); } },
  vote: d => { const g = G(d.id); if (!g || !voteOpen(g)) return; const me = Me.id(); Store.set(`games/${d.id}/votes/${me}`, obj(g.votes)[me] === d.t ? null : d.t); },
  lockTime: d => { const g = G(d.id); const t = leader(g); if (confirm(`Fechar a votação e definir ${hfmt(t)}?`)) { Store.update(`games/${d.id}`, { time: t }); toast(`Horário definido: ${hfmt(t)}`); } },
  rsvp: d => {
    const g = G(d.id); if (!g) return; if (!rsvpOpen(g)) return toast('Lista fechada', true);
    const me = Me.id(), cur = obj(g.rsvp)[me], path = `games/${d.id}/rsvp/${me}`;
    if (cur && cur.s === d.s) { if (d.s === 'in' && !confirm('Tirar seu nome da lista?')) return; Store.set(path, null); return; }
    Store.set(path, { s: d.s, t: Date.now(), by: me });
    if (d.s === 'in') { const L = rsvpList(G(d.id)); toast(L.wait.includes(me) ? 'Lista cheia — você está na espera' : 'Presença confirmada'); }
  },
  unrsvp: d => { if (confirm(`Tirar ${pname(d.pid)} da lista?`)) Store.set(`games/${d.id}/rsvp/${d.pid}`, null); },
  addRsvp: d => {
    const g = G(d.id); const taken = new Set(Object.entries(obj(g.rsvp)).filter(([, r]) => r && r.s === 'in').map(([p]) => p));
    openPicker('Confirmar jogador', taken, pid => { const gg = G(d.id); if (!gg || !rsvpOpen(gg)) return; Store.set(`games/${d.id}/rsvp/${pid}`, { s: 'in', t: Date.now(), by: Me.id() }); toast(`${pname(pid)} confirmado`); });
  },
  pick: d => { const cb = pickCb; closeSheet(); cb && cb(d.pid); },
  draw: d => {
    const g = G(d.id), L = rsvpList(g);
    if (L.ins.length < 2) return toast('Precisa de pelo menos 2 confirmados', true);
    if (Object.keys(obj(g.teams)).length && !confirm('Sortear de novo? Os times atuais serão substituídos.')) return;
    Store.update(`games/${d.id}`, { teams: drawTeams(L.ins) }); toast('Times sorteados');
  },
  rk: d => { rkKey = d.k; render(true); },
  // editor
  side: d => { if (d.s === 'N') delete draft.teams[d.pid]; else draft.teams[d.pid] = d.s; render(true); },
  st: d => { const s = draft.stats[d.pid] = Object.assign({ g: 0, a: 0 }, draft.stats[d.pid]); s[d.k] = Math.max(0, (+s[d.k] || 0) + (+d.d)); render(true); },
  ex: d => { draft.extra[d.k] = Math.max(0, (+draft.extra[d.k] || 0) + (+d.d)); render(true); },
  edAdd: () => {
    const g = G(draft.id), L = rsvpList(g);
    const shown = new Set([...Object.keys(draft.teams), ...L.ins, ...L.wait, ...Object.keys(draft.stats), ...draft.pool]);
    openPicker('Adicionar ao jogo', shown, pid => { if (draft) { draft.pool.push(pid); render(true); } });
  },
  edDraw: () => {
    const g = G(draft.id), L = rsvpList(g);
    if (L.ins.length < 2) return toast('Precisa de pelo menos 2 confirmados', true);
    draft.teams = drawTeams(L.ins); render(true); toast('Sorteado — confira e salve');
  },
  edSave: () => {
    const g = G(draft.id); if (!g) return;
    const teams = {}; for (const [p, s] of Object.entries(draft.teams)) if ((s === 'B' || s === 'P') && P()[p]) teams[p] = s;
    if (draft.mode === 'times') { Store.update(`games/${g.id}`, { teams }); toast('Times salvos'); const id = g.id; draft = null; location.hash = `#/g/${id}`; return; }
    const vals = Object.values(teams);
    if (!vals.includes('B') || !vals.includes('P')) return toast('Escale os dois times antes de salvar', true);
    const stats = {};
    for (const [p, s] of Object.entries(draft.stats)) { if (!teams[p]) continue; const gg = +obj(s).g || 0, aa = +obj(s).a || 0; if (gg || aa) stats[p] = { g: gg, a: aa }; }
    const mvpEl = $('#mvpSel'); if (mvpEl) draft.mvp = mvpEl.value;
    Store.update(`games/${g.id}`, { teams, stats, extra: { B: +draft.extra.B || 0, P: +draft.extra.P || 0 }, score: draftScore(), mvp: teams[draft.mvp] ? draft.mvp : null, done: true, doneAt: Date.now(), doneBy: Me.id() });
    toast('Resultado salvo'); const id = g.id; draft = null; location.hash = `#/g/${id}`;
  },
  edClear: () => {
    if (!confirm('Apagar o resultado deste jogo? (times e lista continuam)')) return;
    const id = draft.id; Store.update(`games/${id}`, { done: null, score: null, stats: null, extra: null, mvp: null, doneAt: null }); draft = null; location.hash = `#/g/${id}`; toast('Resultado apagado');
  },
  // poster
  sharePoster: async d => {
    const blob = await posterBlob(); if (!blob) return; const g = G(d.id);
    const file = new File([blob], `mies-${g.date}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Mies Van der Gol' }); } catch (e) {} }
    else download(blob, file.name);
  },
  dlPoster: async d => { const blob = await posterBlob(); if (blob) download(blob, `mies-${G(d.id).date}.png`); },
  // players
  renamePlayer: d => openSheet(`${sheetHead('Renomear')}<form data-form="renamePlayer" data-id="${d.id}" autocomplete="off"><label class="fld"><span>Nome</span><input name="name" value="${esc(pname(d.id))}" maxlength="24"></label><button class="btn red">Salvar</button></form>`),
  delPlayer: d => {
    const s = computeStats()[d.id];
    if (!confirm(s && s.j ? `${pname(d.id)} tem ${s.j} jogo(s) registrados. Remover mesmo assim? Os números dele saem do ranking.` : `Remover ${pname(d.id)} do elenco?`)) return;
    Store.remove(`players/${d.id}`); if (d.id === Me.id()) Me.clear(); location.hash = '#/elenco'; toast('Jogador removido');
  },
  // settings
  dbLocal: () => { if (!confirm('Desconectar do banco e usar só os dados deste aparelho?')) return; LS.del('mies.dburl'); if (Store.es) Store.es.close(); Store.init(); ensureMe(); render(true); toast('Modo local'); },
  copyInvite: async d => { try { await navigator.clipboard.writeText(d.v); toast('Link copiado'); } catch (e) { prompt('Copie o link:', d.v); } },
  export: () => { download(new Blob([JSON.stringify(Store.state, null, 2)], { type: 'application/json' }), `mies-backup-${todayISO()}.json`); }
};
const FORM = {
  login: fd => {
    const n = String(fd.get('name') || '').trim();
    if (n.length < 2) return toast('Digite seu nome', true);
    const id = ensurePlayer(n); Me.set(id, pname(id)); location.hash = '#/'; render(true);
  },
  game: (fd, f) => {
    const date = fd.get('date'), times = parseTimes(fd.get('times'));
    if (!date) return toast('Escolha a data', true);
    if (!times.length) return toast('Informe ao menos um horário (ex: 21h)', true);
    const vuRaw = fd.get('voteUntil');
    const data = { date, venue: String(fd.get('venue') || '').trim(), times, cap: Math.max(2, Math.min(40, +fd.get('cap') || CONFIG.DEFAULT_CAP)), voteUntil: vuRaw ? new Date(vuRaw).getTime() : defaultVoteUntil(date) };
    const id = f.dataset.id;
    if (id) {
      const sel = fd.get('time');
      data.time = times.length === 1 ? times[0] : (sel && times.includes(sel) ? sel : null);
      Store.update(`games/${id}`, data); toast('Jogo atualizado');
    } else {
      data.time = times.length === 1 ? times[0] : null; data.created = Date.now(); data.by = Me.id();
      const nid = uid(); Store.set(`games/${nid}`, data); location.hash = `#/g/${nid}`; toast('Jogo criado — votação aberta');
    }
    LS.set('mies.lastGame', { venue: data.venue, times: String(fd.get('times')), cap: data.cap });
    closeSheet();
  },
  pickNew: fd => { const n = String(fd.get('name') || '').trim(); if (n.length < 2) return; const id = ensurePlayer(n); const cb = pickCb; closeSheet(); cb && cb(id); },
  addPlayer: (fd, f) => { const n = String(fd.get('name') || '').trim(); if (n.length < 2) return toast('Nome muito curto', true); if (findByName(n)) return toast('Já está no elenco', true); ensurePlayer(n); f.reset(); document.activeElement.blur(); toast(`${n} adicionado`); },
  renameMe: fd => { const n = String(fd.get('name') || '').trim(); if (n.length < 2) return; const me = Me.id(); const ex = findByName(n); if (ex && ex !== me) return toast('Esse nome já existe no elenco', true); Store.update(`players/${me}`, { name: n }); Me.set(me, n); document.activeElement.blur(); toast('Nome salvo'); },
  renamePlayer: (fd, f) => { const n = String(fd.get('name') || '').trim(); if (n.length < 2) return; const id = f.dataset.id; const ex = findByName(n); if (ex && ex !== id) return toast('Esse nome já existe', true); Store.update(`players/${id}`, { name: n }); if (id === Me.id()) Me.set(id, n); closeSheet(); toast('Nome salvo'); },
  dburl: fd => {
    const u = String(fd.get('url') || '').trim().replace(/\/+$/, '');
    if (!u) return toast('Cole a URL do banco', true);
    if (!/^https:\/\/.+\.(firebaseio\.com|firebasedatabase\.app)$/.test(u) && !confirm('A URL não parece um Firebase Realtime Database. Usar mesmo assim?')) return;
    LS.set('mies.dburl', u); document.activeElement.blur(); Store.init(); render(true); toast('Conectando ao banco…');
  }
};

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('submit', e => {
  const f = e.target, fn = FORM[f.dataset.form];
  if (fn) { e.preventDefault(); fn(new FormData(f), f); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'date' && t.form && t.form.dataset.form === 'game' && t.value) t.form.voteUntil.value = toLocalInput(defaultVoteUntil(t.value));
  if (t.id === 'mvpSel' && draft) draft.mvp = t.value;
  if (t.id === 'importFile' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || typeof data !== 'object' || (!data.players && !data.games)) throw new Error();
        const np = Object.keys(obj(data.players)).length, ng = Object.keys(obj(data.games)).length;
        if (!confirm(`Importar ${np} jogadores e ${ng} jogos? Isso SUBSTITUI os dados atuais${Store.mode === 'remote' ? ' do banco (para todos)' : ''}.`)) return;
        Store.set('', { players: obj(data.players), games: obj(data.games) }); ensureMe(); toast('Dados importados');
      } catch (err) { toast('Arquivo inválido', true); }
      t.value = '';
    };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !inputFocused()) render(); }, 60));
window.addEventListener('hashchange', () => { closeSheet(); render(true); });
window.addEventListener('online', () => { if (Store.mode === 'remote' && Store.status !== 'online') Store.connect(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
setInterval(() => { if (!document.hidden) render(); }, 60000); // fases mudam com o relógio

/* ---------------- boot ---------------- */
document.addEventListener('DOMContentLoaded', () => {
  const q = new URLSearchParams(location.search);
  if (q.get('db')) { LS.set('mies.dburl', q.get('db')); history.replaceState(null, '', location.pathname + location.hash); }
  Store.init();
  if (Store.mode === 'local') ensureMe();
  render(true);
});
</script>
